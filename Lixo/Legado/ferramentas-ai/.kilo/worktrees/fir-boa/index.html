    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- Apply cached theme BEFORE React loads to prevent flash -->
    <script>
      (function() {
        try {
          // Apply cached color theme
          var themeCache = localStorage.getItem('activeTheme');
          if (themeCache) {
            var theme = JSON.parse(themeCache);
            if (theme && theme.palette) {
              var root = document.documentElement;
              var p = theme.palette;
              root.style.setProperty('--primary', p['500']);
              root.style.setProperty('--accent', p['500']);
              root.style.setProperty('--ring', p['500']);
              root.style.setProperty('--sidebar-primary', p['500']);
              root.style.setProperty('--sidebar-ring', p['500']);
              root.style.setProperty('--sidebar-accent', p['700']);
              // Apply gradient
              var h = p['500'].split(' ')[0];
              root.style.setProperty('--gradient-primary', 'linear-gradient(135deg, hsl(' + p['500'] + ') 0%, hsl(' + h + ' 95% 55%) 100%)');
              root.style.setProperty('--shadow-glow', '0 0 40px hsl(' + p['500'] + ' / 0.3)');
            }
          }
          
          // Apply cached layout setting to prevent layout flash
          var layoutCache = localStorage.getItem('navigation_layout');
          if (layoutCache) {
            document.documentElement.dataset.layoutPreference = layoutCache;
          }
        } catch (e) {
          // Silently fail - React will handle it
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
