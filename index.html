    <meta property="og:title" content="EduStream - Plataforma EAD Premium" />
    <meta property="og:description" content="Aprenda com os melhores cursos online. Experiência de aprendizado premium." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fontes dos presets de tema do checkout (ver src/types/checkout-presets.ts). -->
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:wght@400..700&family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&family=Lato:wght@400;700&family=Montserrat:wght@400..700&family=Open+Sans:wght@400..700&family=Outfit:wght@400..700&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- Apply cached theme BEFORE React loads to prevent flash -->
    <script>
      (function() {
        var root = document.documentElement;

        function applyPalette(p) {
          if (!p || !p['500']) return;
          var h = p['500'].split(' ')[0];
          root.style.setProperty('--primary', p['500']);
          root.style.setProperty('--accent', p['500']);
          root.style.setProperty('--ring', p['500']);
          root.style.setProperty('--sidebar-primary', p['500']);
          root.style.setProperty('--sidebar-ring', p['500']);
          root.style.setProperty('--sidebar-accent', p['700']);
          root.style.setProperty('--gradient-primary', 'linear-gradient(135deg, hsl(' + p['500'] + ') 0%, hsl(' + h + ' 95% 55%) 100%)');
          root.style.setProperty('--shadow-glow', '0 0 40px hsl(' + p['500'] + ' / 0.3)');
          Object.keys(p).forEach(function (shade) {
            root.style.setProperty('--primary-' + shade, p[shade]);
          });
        }

        // ---------- 1) último tema conhecido (instantâneo) ----------
        try {
          var themeCache = localStorage.getItem('activeTheme');
          if (themeCache) {
            var theme = JSON.parse(themeCache);
            if (theme && theme.vars) {
              // Formato atual: conjunto completo de variáveis já calculadas
              Object.keys(theme.vars).forEach(function (name) {
                if (theme.vars[name]) root.style.setProperty(name, theme.vars[name]);
              });
            } else if (theme && theme.palette) {
              // Formato antigo (cache de versões anteriores)
              applyPalette(theme.palette);
            }
          }

          // Cores do gradiente de texto (configuradas no Branding)
          var gradientCache = localStorage.getItem('brandingGradient');
          if (gradientCache) {
            var gradient = JSON.parse(gradientCache);
            if (gradient && gradient.start && gradient.end) {
              root.style.setProperty('--gradient-text-start', gradient.start);
              root.style.setProperty('--gradient-text-end', gradient.end);
            }
          }

          // Apply cached layout setting to prevent layout flash
          var layoutCache = localStorage.getItem('navigation_layout');
          if (layoutCache) {
            document.documentElement.dataset.layoutPreference = layoutCache;
          }
        } catch (e) {
          // Silently fail - React will handle it
        }

        // ---------- 2) tema real da plataforma, antes do React ----------
        // Primeira visita no navegador não tem cache e veria a cor padrão até
        // o bundle carregar. Esta consulta começa junto com o HTML e o React
        // reaproveita a mesma promise (ver useTheme), sem request duplicado.
        var supabaseUrl = "%VITE_SUPABASE_URL%";
        var supabaseKey = "%VITE_SUPABASE_ANON_KEY%";
        if (supabaseUrl && supabaseKey &&
            supabaseUrl.indexOf('%VITE_') !== 0 && supabaseKey.indexOf('%VITE_') !== 0) {
          window.__themeBootstrap = fetch(
            supabaseUrl.replace(/\/+$/, '') +
              '/rest/v1/theme_settings?select=id,primary_color,color_palette,is_active,preset&is_active=eq.true',
            { headers: { apikey: supabaseKey, Authorization: 'Bearer ' + supabaseKey } }
          )
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (rows) {
              // Preset global vence a paleta manual; nesse caso não pinta a
              // paleta para não mostrar uma cor que o React vai trocar.
              if (rows && rows[0] && rows[0].color_palette && !rows[0].preset) {
                applyPalette(rows[0].color_palette);
              }
              return rows;
            })
            .catch(function () { return null; });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
