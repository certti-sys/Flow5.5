server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Paridade com vercel.json — manter CSP em sincronia
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.mercadopago.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.brevo.com https://*.b-cdn.net https://*.bunnycdn.com https://*.googlevideo.com https://*.vimeocdn.com https://api.mercadopago.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mercadolivre.com https://api.stripe.com https://*.stripe.com https://*.pagseguro.uol.com.br https://*.hotmart.com https://*.kiwify.com.br; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://www.youtube.com https://youtube.com https://*.youtube.com https://www.youtube-nocookie.com https://vimeo.com https://*.vimeo.com https://player.vimeo.com https://www.wistia.com https://*.wistia.com https://*.wistia.net https://iframe.mediadelivery.net https://*.pandavideo.com.br https://*.vturb.com.br https://player.vturb.com.br https://drive.google.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mercadolivre.com https://*.dropbox.com https://*.onedrive.live.com https://*.sharepoint.com; media-src 'self' https://*.supabase.co https://*.b-cdn.net https://*.bunnycdn.com https://*.vimeocdn.com; worker-src 'self' blob:; frame-ancestors 'self'; upgrade-insecure-requests;" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA: qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome: cache longo (expires nao descarta os add_header do server)
    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
