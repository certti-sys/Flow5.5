[functions.webhooks-ingest]
verify_jwt = false

# Drenagem da fila de webhooks de saída. `verify_jwt = false` porque o
# agendador (pg_cron via pg_net) manda o service role no header, e a function
# valida por conta própria (service role ou admin).
[functions.dispatch-webhooks]
verify_jwt = false

# Drenagem da fila de notificações no WhatsApp. Mesmo desenho: valida
# service role ou admin por conta própria.
[functions.dispatch-notifications]
verify_jwt = false

# Drenagem da fila de integrações de marketing (UTMfy, Meta CAPI, Spedy).
# Mesmo desenho do webhook de saída.
[functions.dispatch-integrations]
verify_jwt = false

[functions.delete-user]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[functions.send-whatsapp]
verify_jwt = true

[functions.create-user]
verify_jwt = true

[functions.reset-user-password]
